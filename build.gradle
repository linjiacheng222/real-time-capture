plugins {
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    // Mixin 基建（I1.1.1）：注解处理器生成 refmap、清单注入 MixinConfigs、dev 运行配置
    id 'org.spongepowered.mixin' version '0.7.38'
}

// Mixin 注解处理器/运行库来源（Sponge 官方 maven；plugin portal 不收录 mixingradle）
repositories {
    mavenCentral()
    maven {
        name = 'Sponge'
        url = 'https://repo.spongepowered.org/repository/maven-public/'
    }
}

version = modVersion
group = modMavenGroup

base {
    archivesName = modId
}

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

// 源码统一 UTF-8（否则平台默认 GBK 会把中文注释按不可映射字符告警/乱码）
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// 先声明服务端组件 source set，供 server run 配置引用
sourceSets {
    serverComponent {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

minecraft {
    // 红线 2：统一 Mojang 官方映射（Mojmap），禁用 Connector 类混合加载器
    mappings channel: 'official', version: minecraftVersion
    copyIdeResources = true

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'debug'
            // dev 环境（Mojmap named）加载 run/mods 中的生产（SRG/reobf）模组时，需要
            // 让 Mixin 用 SRG→named 映射表重映射第三方 jar 的 refmap，否则 @Shadow 的
            // SRG 名（如 m_5601_）在 named 目标类中找不到，会在 early display 阶段崩溃。
            // createSrgToMcp 由 ForgeGradle 在 run 任务图中生成。
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${projectDir}/build/createSrgToMcp/output.srg"
            // dev 自检开关（仅开发运行）：让 Mixin/AT/refmap 基建自检日志以 INFO 输出，
            // 便于验收留证；生产运行不设置该属性、默认静默（DEBUG 级）。
            property 'captureapi.debug.mixin', 'true'
            // M1 核心设施自检（T1.2/T1.3）：GL 守卫正/负例、最新值通道、资源管理器生命周期。
            property 'captureapi.debug.selftest', 'true'
            if (name != 'server') {
                mods {
                    "${modId}" {
                        source sourceSets.main
                    }
                }
            }
        }
        client {
            // 纯客户端模组：仅提供 client 运行配置（附录E §2.1）
        }
        server {
            // 仅用于验证 M9 服务端组件；不加载客户端主模组
            client(false)
            mods {
                captureapi_server {
                    source sourceSets.serverComponent
                }
            }
        }
    }
}

// MixinGradle 会向所有 run 注入客户端的 --mixin.config；server 运行不需要
afterEvaluate {
    minecraft.runs.matching { it.name == 'server' }.configureEach {
        args.removeAll { it == '--mixin.config' || it.toString() == 'captureapi.mixins.json' }
    }
}

// Mixin 基建（I1.1.1）：注册 refmap 输出与 mixin 配置；
// refmap 由 annotationProcessor 在编译期生成，reobf 后随生产 jar 发布。
mixin {
    add sourceSets.main, "${modId}.refmap.json"
    config "${modId}.mixins.json"
}

dependencies {
    // dev Forge：用已缓存的 47.4.23 mapped（D-BUILD-3 已裁决），发布下限仍由 mods.toml 的 minForgeVersion 控制
    minecraft "net.minecraftforge:forge:${minecraftVersion}-${devForgeVersion}"

    // Mixin 注解处理器：编译期生成 captureapi.refmap.json（MixinGradle 0.7.38 不自动注入该依赖）
    annotationProcessor 'org.spongepowered:mixin:0.8.5:processor'

    // 硬依赖 Embeddium / ModernFix 由用户自行安装（D1 裁决），本工程不引入其编译期依赖，
    // 仅在 mods.toml 中声明 mandatory（运行时校验），适配工作经 Mixin/事件在源码级完成。

}

// M9：可选服务端组件独立 source set（独立 jar，独立 modid）
sourceSets {
    serverComponent {
        compileClasspath += sourceSets.main.compileClasspath
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
}

tasks.register('serverComponentJar', Jar) {
    group = 'build'
    description = 'Build optional CaptureAPI server component jar (M9)'
    archiveClassifier = 'server'
    from sourceSets.serverComponent.output
    exclude 'captureapi.refmap.json'
    exclude 'captureapi.mixins.json'
    manifest {
        attributes([
                'Specification-Title'   : 'captureapi-server',
                'Implementation-Title'  : 'CaptureAPI Server Component',
                'Implementation-Version': project.version
        ])
    }
}

reobf {
    serverComponentJar {}
}

// 服务端组件不是 Mixin 模组：禁用 MixinGradle 给它注入 MixinConfigs（否则会引用不存在的配置）
afterEvaluate {
    tasks.matching { it.name == 'addMixinsToServerComponentJar' }.configureEach { enabled = false }
    tasks.named('addMixinsToJarJar') {}
}

tasks.named('build') {
    dependsOn 'reobfServerComponentJar'
}

tasks.named('processResources', ProcessResources).configure {
    filteringCharset = 'UTF-8'
    var replaceProperties = [
            minecraftVersion   : minecraftVersion,
            minForgeVersion    : minForgeVersion,
            modId              : modId,
            modName            : modName,
            modVersion         : modVersion,
            modAuthor          : modAuthor,
            modDescription     : modDescription,
            modLicense         : modLicense,
            modSourceUrl       : modSourceUrl,
            modIssueUrl        : modIssueUrl,
            modForgeDisplayTest: modForgeDisplayTest,
            embeddiumVersion   : embeddiumVersion,
            modernfixVersion   : modernfixVersion,
            minModernfixVersion: minModernfixVersion
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/mods.toml', 'pack.mcmeta']) {
        expand replaceProperties
    }
}

tasks.named('jar', Jar).configure {
    manifest {
        attributes([
                'Specification-Title'   : modId,
                'Specification-Vendor'  : modAuthor,
                'Specification-Version' : '1',
                'Implementation-Title'  : project.name,
                'Implementation-Version': project.jar.archiveVersion,
                'Implementation-Vendor' : modAuthor
        ])
    }
    finalizedBy 'reobfJar'
}
